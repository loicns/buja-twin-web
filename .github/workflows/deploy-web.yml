name: deploy-web
on:
  push: { branches: [main], paths: ["web/**", ".github/workflows/deploy-web.yml"] }
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
        env:
          VITE_DATA_URL: ${{ vars.DATA_URL }}      # public R2 origin; empty falls back to the default in src/config.ts
          VITE_API_URL: ${{ vars.API_URL }}        # Lambda Function URL; empty hides the live-preview panel
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=buja-flood-twin --branch=main
